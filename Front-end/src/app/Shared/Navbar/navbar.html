<header class="absolute left-0 right-0 top-0 z-30 px-5 py-4 sm:px-8 lg:px-12">
  <nav class="mx-auto flex max-w-7xl items-center justify-between rounded-full border border-white/70 bg-white/75 px-4 py-3 shadow-[0_18px_60px_rgba(15,23,42,0.08)] backdrop-blur-xl sm:px-5">
    <a routerLink="/" class="flex items-center gap-3">
      <span class="grid h-9 w-9 place-items-center rounded-full bg-slate-950 text-sm font-semibold text-white">IQ</span>
      <span class="text-sm font-semibold tracking-[0.18em] text-slate-950">IT-QUIZ</span>
    </a>

    <div class="hidden items-center gap-7 text-sm font-medium text-slate-600 md:flex">
      <a routerLink="/" routerLinkActive="text-slate-950" [routerLinkActiveOptions]="{ exact: true }" class="transition-colors hover:text-slate-950">Home</a>
      <a routerLink="/quizes" routerLinkActive="text-slate-950" class="transition-colors hover:text-slate-950">Quizzes</a>
      <a *ngIf="!authService.isAuthenticated()" routerLink="/login" routerLinkActive="text-slate-950" class="transition-colors hover:text-slate-950">Login</a>
    </div>

    <a
      *ngIf="!authService.isAuthenticated()"
      routerLink="/register"
      routerLinkActive="bg-slate-800"
      class="rounded-full bg-slate-950 px-5 py-2.5 text-sm font-medium text-white shadow-sm transition-colors hover:bg-slate-800"
    >
      Start free
    </a>

    <button
      *ngIf="authService.isAuthenticated()"
      type="button"
      (click)="logout()"
      class="rounded-full bg-slate-950 px-5 py-2.5 text-sm font-medium text-white shadow-sm transition-colors hover:bg-slate-800"
    >
      Logout
    </button>
  </nav>
</header>
