<main class="min-h-screen bg-[#f8fafc] text-slate-950">
  <section class="relative min-h-screen overflow-hidden bg-slate-950">
    <img
      src="assets/images/dev-2.png"
      alt="Learner creating an IT-Quiz account"
      class="absolute inset-0 h-full w-full object-cover object-[68%_center]"
    />
    <div class="absolute inset-0 bg-[linear-gradient(90deg,rgba(248,250,252,0.98)_0%,rgba(248,250,252,0.92)_42%,rgba(248,250,252,0.30)_72%,rgba(15,23,42,0.20)_100%)]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_18%_22%,rgba(20,184,166,0.18),transparent_28%),linear-gradient(0deg,rgba(15,23,42,0.20),transparent_42%)]"></div>

    <navbar></navbar>

    <div class="relative z-20 mx-auto grid min-h-screen max-w-7xl items-center gap-10 px-5 pb-16 pt-32 sm:px-8 lg:grid-cols-[0.9fr_1.1fr] lg:px-12">
      <div class="max-w-xl">
        <span class="rounded-full border border-teal-200 bg-teal-50 px-4 py-2 text-xs font-semibold uppercase tracking-[0.18em] text-teal-700">
          Start your track
        </span>

        <h1 class="mt-6 text-5xl font-semibold leading-[0.98] text-slate-950 sm:text-6xl">
          Build a smarter study routine.
        </h1>

        <p class="mt-6 rounded-xl bg-white/60 p-4 text-lg leading-8 text-slate-700 backdrop-blur-sm sm:bg-transparent sm:p-0">
          Create your account and unlock protected quizzes, guided practice, and progress tracking.
        </p>
      </div>

      <div class="ml-auto w-full max-w-md rounded-2xl border border-white/70 bg-white/80 p-6 shadow-[0_24px_90px_rgba(15,23,42,0.16)] backdrop-blur-xl sm:p-8">
        <div class="mb-8">
          <p class="text-sm font-semibold uppercase tracking-[0.18em] text-teal-700">Register</p>
          <h2 class="mt-3 text-3xl font-semibold text-slate-950">Create account</h2>
          <p class="mt-2 text-sm leading-6 text-slate-600">
            Your account will be connected to the IT-Quiz authentication API.
          </p>
        </div>

        <p *ngIf="errorMessage" class="mb-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700">
          {{ errorMessage }}
        </p>

        <form class="space-y-5" (ngSubmit)="register()" #registerForm="ngForm">
          <label class="block">
            <span class="text-sm font-semibold text-slate-700">Full name</span>
            <input
              type="text"
              name="name"
              [(ngModel)]="account.name"
              required
              minlength="2"
              autocomplete="name"
              placeholder="John Doe"
              class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-950 outline-none transition-colors placeholder:text-slate-400 focus:border-teal-500"
            />
          </label>

          <label class="block">
            <span class="text-sm font-semibold text-slate-700">Email</span>
            <input
              type="email"
              name="email"
              [(ngModel)]="account.email"
              required
              email
              autocomplete="email"
              placeholder="you@example.com"
              class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-950 outline-none transition-colors placeholder:text-slate-400 focus:border-teal-500"
            />
          </label>

          <label class="block">
            <span class="text-sm font-semibold text-slate-700">Password</span>
            <input
              type="password"
              name="password"
              [(ngModel)]="account.password"
              required
              minlength="6"
              autocomplete="new-password"
              placeholder="Minimum 6 characters"
              class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-950 outline-none transition-colors placeholder:text-slate-400 focus:border-teal-500"
            />
          </label>

          <label class="block">
            <span class="text-sm font-semibold text-slate-700">Confirm password</span>
            <input
              type="password"
              name="confirmedPassword"
              [(ngModel)]="account.confirmedPassword"
              required
              minlength="6"
              autocomplete="new-password"
              placeholder="Repeat your password"
              class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-950 outline-none transition-colors placeholder:text-slate-400 focus:border-teal-500"
            />
          </label>

          <button
            type="submit"
            [disabled]="registerForm.invalid || isLoading"
            class="w-full rounded-full bg-slate-950 px-6 py-4 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-slate-800 disabled:cursor-not-allowed disabled:bg-slate-400"
          >
            {{ isLoading ? 'Creating account...' : 'Create account' }}
          </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-600">
          Already have an account?
          <a routerLink="/login" class="font-semibold text-teal-700 hover:text-teal-800">
            Sign in
          </a>
        </p>
      </div>
    </div>
  </section>
</main>
